[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-flake-detective"
version = "0.1.0"
description = "CI flake, regression, environment failure, duration drift, and retry analysis for JUnit-based test runs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "ci-flake-detective maintainers" }
]
keywords = ["ci", "junit", "flaky-tests", "pytest", "playwright", "github-actions", "devtools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing"
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
ci-flake-detective = "ci_flake_detective.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

